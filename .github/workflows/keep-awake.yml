# Free Render services sleep after 15 idle minutes. Ping both demo backends
# during Indian working hours (08:30–19:30 IST, Mon–Sat) so demos load instantly.
# That is roughly 285 hours a month per service, inside Render's 750 free hours.
name: Keep demo backends awake

on:
  schedule:
    - cron: "*/12 3-13 * * 1-6"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backends
        run: |
          for url in https://studlyf-demo-main-api.onrender.com/health https://studlyf-demo-hr-api.onrender.com/api/health; do
            curl -s -o /dev/null -m 90 -w "%{http_code} %{time_total}s $url\n" "$url" || true
          done
